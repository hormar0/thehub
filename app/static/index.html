<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Hub</title>
<style>
  :root {
    --text: #f2f5fa; --muted: rgba(235, 242, 255, .58);
    --glass: rgba(255, 255, 255, .07);
    --glass-strong: rgba(255, 255, 255, .11);
    --glass-border: rgba(255, 255, 255, .16);
    --glass-highlight: rgba(255, 255, 255, .22);
    --accent: #6ea8ff;
    --green: #5ee38a; --amber: #ffcf6e; --red: #ff7d78; --purple: #cfa9ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Inter", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1100px 700px at 12% -10%, rgba(110, 140, 255, .32), transparent 60%),
      radial-gradient(900px 650px at 88% 8%, rgba(160, 90, 255, .28), transparent 55%),
      radial-gradient(1000px 800px at 50% 115%, rgba(60, 200, 190, .22), transparent 60%),
      radial-gradient(700px 500px at 70% 55%, rgba(255, 120, 170, .14), transparent 60%),
      #0a0e1a;
    background-attachment: fixed;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 0 18px; height: 46px;
    position: sticky; top: 0; z-index: 10;
    background: rgba(14, 18, 32, .42);
    border-bottom: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 var(--glass-highlight);
    backdrop-filter: blur(28px) saturate(170%);
    -webkit-backdrop-filter: blur(28px) saturate(170%);
  }
  header .logo { font-weight: 700; font-size: 15px; letter-spacing: .2px; text-shadow: 0 1px 8px rgba(110,168,255,.35); }
  header .logo span { background: linear-gradient(90deg, #8ab8ff, #cfa9ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  nav { display: flex; gap: 3px; margin-left: 10px; }
  nav button {
    background: transparent; border: 1px solid transparent; color: var(--muted);
    padding: 6px 9px; border-radius: 8px; cursor: pointer; font-size: 12.5px;
    transition: all .18s ease;
  }
  nav button:hover { color: var(--text); background: rgba(255,255,255,.06); }
  nav button.active {
    color: var(--text);
    background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
    border-color: var(--glass-border);
    box-shadow: 0 4px 14px rgba(0,0,0,.25), inset 0 1px 0 var(--glass-highlight);
  }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  h2 { font-size: 20px; margin-bottom: 4px; letter-spacing: .2px; text-shadow: 0 1px 10px rgba(0,0,0,.4); }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .grid { display: grid; gap: 16px; }
  .cards { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .card {
    background: linear-gradient(160deg, var(--glass-strong), var(--glass) 55%, rgba(255,255,255,.04));
    border: 1px solid var(--glass-border); border-radius: 16px; padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 var(--glass-highlight);
    backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%);
  }
  .card .kpi { font-size: 28px; font-weight: 700; background: linear-gradient(90deg, #fff, #bcd4ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card .lbl { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .panel {
    background: linear-gradient(160deg, var(--glass-strong), var(--glass) 55%, rgba(255,255,255,.04));
    border: 1px solid var(--glass-border); border-radius: 16px; padding: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 var(--glass-highlight);
    backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%);
  }
  .panel h3 { font-size: 15px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; padding: 8px 10px; border-bottom: 1px solid var(--glass-border); }
  td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .p-green { background: rgba(94,227,138,.14); color: var(--green); border-color: rgba(94,227,138,.35); }
  .p-amber { background: rgba(255,207,110,.14); color: var(--amber); border-color: rgba(255,207,110,.35); }
  .p-red { background: rgba(255,125,120,.14); color: var(--red); border-color: rgba(255,125,120,.35); }
  .p-purple { background: rgba(207,169,255,.14); color: var(--purple); border-color: rgba(207,169,255,.35); }
  .p-gray { background: rgba(255,255,255,.08); color: var(--muted); border-color: var(--glass-border); }
  .bar { height: 9px; background: rgba(255,255,255,.09); border-radius: 999px; overflow: hidden; min-width: 90px; box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  .bar > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6ea8ff, #cfa9ff); box-shadow: 0 0 10px rgba(140,160,255,.55); }
  .att { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.07); font-size: 13.5px; align-items: baseline; }
  .att:last-child { border-bottom: none; }
  .att::before { content: "▸"; color: var(--red); text-shadow: 0 0 8px rgba(255,125,120,.6); }
  .gate-rail { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
  .gate-node {
    flex: 1; min-width: 130px; border-radius: 14px; padding: 12px;
    background: linear-gradient(160deg, var(--glass-strong), var(--glass));
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 24px rgba(0,0,0,.3), inset 0 1px 0 var(--glass-highlight);
    backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
  }
  .gate-node.current { border-color: rgba(140,175,255,.65); box-shadow: 0 0 0 1px rgba(140,175,255,.5), 0 0 24px rgba(110,168,255,.35), inset 0 1px 0 var(--glass-highlight); }
  .gate-node .gid { font-weight: 700; font-size: 13px; }
  .gate-node .gname { color: var(--muted); font-size: 12px; margin: 4px 0 8px; min-height: 28px; }
  .gate-node .gdate { font-size: 12px; color: var(--muted); }
  .two-col { grid-template-columns: 1fr 1fr; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .btn {
    background: linear-gradient(160deg, rgba(140,175,255,.85), rgba(110,140,255,.75));
    color: #fff; border: 1px solid rgba(255,255,255,.35); padding: 7px 14px; border-radius: 10px;
    cursor: pointer; font-size: 13px; font-weight: 600;
    box-shadow: 0 6px 18px rgba(110,140,255,.35), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 9px 22px rgba(110,140,255,.45), inset 0 1px 0 rgba(255,255,255,.5); }
  .btn.ghost {
    background: linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,.05));
    color: var(--text); border: 1px solid var(--glass-border);
    box-shadow: 0 4px 14px rgba(0,0,0,.25), inset 0 1px 0 var(--glass-highlight);
  }
  select, input, textarea {
    background: rgba(10, 14, 26, .45); border: 1px solid var(--glass-border); color: var(--text);
    border-radius: 9px; padding: 6px 8px; font-size: 13px;
    box-shadow: inset 0 1px 4px rgba(0,0,0,.35);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  select:focus, input:focus, textarea:focus { outline: 1px solid rgba(140,175,255,.6); }
  .modal-bg { position: fixed; inset: 0; background: rgba(5, 8, 16, .55); display: none; align-items: center; justify-content: center; z-index: 20; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .modal-bg.open { display: flex; }
  .modal {
    border-radius: 20px; padding: 22px; width: 440px; max-width: 92vw;
    background: linear-gradient(165deg, rgba(52, 62, 92, .72), rgba(22, 28, 48, .78));
    border: 1px solid var(--glass-border);
    box-shadow: 0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 var(--glass-highlight);
    backdrop-filter: blur(36px) saturate(170%); -webkit-backdrop-filter: blur(36px) saturate(170%);
  }
  .modal h3 { margin-bottom: 14px; }
  .modal label { display: block; color: var(--muted); font-size: 12.5px; margin: 10px 0 4px; }
  .modal input, .modal select, .modal textarea { width: 100%; }
  .modal .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .brief { font-size: 14px; line-height: 1.65; }
  .brief h4 { margin: 16px 0 6px; font-size: 14px; background: linear-gradient(90deg, #8ab8ff, #cfa9ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brief li { margin-left: 18px; margin-bottom: 4px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .kanban { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; align-items: start; }
  .kb-col {
    border-radius: 16px; padding: 12px; min-height: 200px;
    background: linear-gradient(170deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 26px rgba(0,0,0,.3), inset 0 1px 0 var(--glass-highlight);
    backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .kb-col.drag-over { border-color: rgba(140,175,255,.7); box-shadow: 0 0 0 1px rgba(140,175,255,.5), 0 0 26px rgba(110,168,255,.4); }
  .kb-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; font-weight: 700; }
  .kb-count { background: rgba(255,255,255,.1); border: 1px solid var(--glass-border); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--muted); }
  .kb-card {
    border-radius: 12px; padding: 10px; margin-bottom: 8px; cursor: grab; font-size: 13px;
    background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    border: 1px solid var(--glass-border);
    box-shadow: 0 5px 16px rgba(0,0,0,.28), inset 0 1px 0 var(--glass-highlight);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .kb-card:hover { transform: translateY(-2px); box-shadow: 0 9px 22px rgba(0,0,0,.35), inset 0 1px 0 var(--glass-highlight); }
  .kb-card.dragging { opacity: .35; }
  .kb-card .kb-id { color: var(--muted); font-size: 11px; font-weight: 700; }
  .kb-card .kb-title { margin: 3px 0 6px; line-height: 1.35; }
  .kb-meta { display: flex; justify-content: space-between; gap: 6px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
  .kb-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 5px; border-radius: 6px; }
  .kb-del:hover { color: var(--red); background: rgba(255,125,120,.14); }
  .rowmenu .menu-item { display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px; }
  .rowmenu .menu-item:hover { background: rgba(255,255,255,.1); }
  .tl { display:inline-block; width:14px; height:14px; border-radius:50%; cursor:pointer; border:2px solid rgba(255,255,255,.25); }
  .tl-green { background:#3fb950; box-shadow:0 0 8px rgba(63,185,80,.8); }
  .tl-amber { background:#d29922; box-shadow:0 0 8px rgba(210,153,34,.8); }
  .tl-red { background:#f85149; box-shadow:0 0 8px rgba(248,81,73,.8); }
  .tl-lg { width:20px; height:20px; }
  .rag-outline { border-width: 2px; }
  .rag-green { border-color: rgba(63,185,80,.75); box-shadow: 0 0 18px rgba(63,185,80,.28), 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 var(--glass-highlight); }
  .rag-amber { border-color: rgba(210,153,34,.75); box-shadow: 0 0 18px rgba(210,153,34,.28), 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 var(--glass-highlight); }
  .rag-red { border-color: rgba(248,81,73,.8); box-shadow: 0 0 18px rgba(248,81,73,.32), 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 var(--glass-highlight); }
  .gbar { touch-action: none; }

  /* Tablet landscape (e.g. 1024x768 … 1366x768) */
  @media (min-width: 768px) and (max-width: 1366px) and (orientation: landscape) {
    header { height: 44px; padding: 0 12px; gap: 8px; }
    nav { overflow-x: auto; scrollbar-width: none; flex: 1; }
    nav::-webkit-scrollbar { display: none; }
    nav button { white-space: nowrap; padding: 5px 8px; font-size: 12px; }
    main { padding: 14px; max-width: 100%; }
    .cards { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    .card { padding: 12px; }
    .card .kpi { font-size: 22px; }
    .panel { padding: 14px; }
    .gate-rail { gap: 8px; }
    .gate-node { min-width: 150px; }
    .two-col { grid-template-columns: 1fr 1fr; gap: 12px; }
    table { font-size: 12.5px; }
    td, th { padding: 7px 8px; }
    .panel table { display: block; overflow-x: auto; }
    h2 { font-size: 18px; }
  }
  /* Small tablets / portrait */
  @media (max-width: 820px) {
    header { flex-wrap: wrap; height: auto; padding: 8px 12px; }
    nav { order: 3; width: 100%; overflow-x: auto; }
    main { padding: 12px; }
    .two-col { grid-template-columns: 1fr; }
    .cards { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
  }
</style>
</head>
<body>
<header>
  <button id="hamburger" title="Menu" style="background:transparent;border:1px solid var(--glass-border);color:var(--text);border-radius:10px;padding:6px 10px;cursor:pointer;font-size:15px;line-height:1">☰</button>
  <div class="logo" style="margin-left:auto;cursor:pointer" onclick="currentView='program';render()" title="Home">The<span>Hub</span></div>
  <nav id="nav"></nav>
  <div id="menu" style="display:none;position:absolute;top:44px;left:10px;background:linear-gradient(165deg, rgba(52,62,92,.85), rgba(22,28,48,.9));border:1px solid var(--glass-border);border-radius:14px;padding:8px;min-width:240px;max-height:70vh;overflow-y:auto;box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 var(--glass-highlight);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);z-index:30"></div>
</header>
<main id="app"></main>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<script>
async function reportClientError(level, source, message, detail) {
  try { await fetch('/api/errors/log', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ level, source, message, detail }) }); } catch (e) {}
}
window.addEventListener('error', e => reportClientError('ERROR', 'window', e.message, (e.filename || '') + ':' + (e.lineno || '')));
window.addEventListener('unhandledrejection', e => reportClientError('ERROR', 'unhandledrejection', String(e.reason && e.reason.message || e.reason), ''));
const _origFetch = window.fetch;
window.fetch = async function(...args) {
  try {
    const res = await _origFetch(...args);
    if (!res.ok) reportClientError('WARN', 'fetch ' + args[0], 'HTTP ' + res.status, '');
    return res;
  } catch (e) {
    reportClientError('ERROR', 'fetch ' + args[0], e.message, '');
    throw e;
  }
};
let app = document.getElementById('app');
let currentView = 'dashboard';
let subView = 'register';
let moduleMap = {};
let settingsTab = 'store';
async function api(path, method = 'GET', body = null) {
  const res = await fetch('/api' + path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : null });
  return res.json();
}
function pill(text, cls) { return `<span class="pill ${cls}">${esc(text)}</span>`; }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function statePill(s) {
  const map = { verified: ['Verified','p-green'], in_review: ['In review','p-purple'], in_progress: ['In progress','p-amber'], blocked: ['Blocked','p-red'], not_started: ['Not started','p-gray'] };
  const [t, c] = map[s] || [s, 'p-gray']; return pill(t, c);
}
function gatePill(s) {
  const map = { passed: ['Passed','p-green'], passed_with_conditions: ['Passed w/ conditions','p-amber'], failed: ['Failed','p-red'], held: ['Held','p-purple'], in_progress: ['In progress','p-amber'], upcoming: ['Upcoming','p-gray'] };
  const [t, c] = map[s] || [s, 'p-gray']; return pill(t, c);
}
function sevPill(s) {
  const map = { very_high: ['Very High','p-red'], high: ['High','p-red'], medium: ['Medium','p-amber'], low: ['Low','p-gray'] };
  const [t, c] = map[s] || [s, 'p-gray']; return pill(t, c);
}
function evPill(s) {
  const map = { present: ['Present','p-green'], partial: ['Partial','p-amber'], missing: ['Missing','p-red'] };
  const [t, c] = map[s] || [s, 'p-gray']; return pill(t, c);
}
function condPill(s) {
  const map = { open: ['Open','p-amber'], met: ['Met','p-green'], expired: ['Expired','p-red'] };
  const [t, c] = map[s] || [s, 'p-gray']; return pill(t, c);
}
async function loadModules() {
  const mods = await api('/modules');
  moduleMap = Object.fromEntries(mods.map(m => [m.name, m]));
  const viewFor = {}; document.querySelectorAll('#nav button').forEach(() => {});
  document.querySelectorAll('#nav button').forEach(b => {
    const mod = Object.keys(viewFor).find(k => viewFor[k] === b.dataset.view);
    if (mod) b.style.display = moduleMap[mod] && moduleMap[mod].enabled ? '' : 'none';
  });
}
const ALL_VIEWS = [
  { id: 'program', label: 'Program', icon: '▦' },
  { id: 'projects', label: 'Projects', icon: '▤' },
  { id: 'gates', label: 'Gates', icon: '◆' },
  { id: 'risks', label: 'Risks', icon: '⚠' },
  { id: 'time', label: 'Time', icon: '⏱' },
  { id: 'readiness', label: 'Readiness', icon: '◎' },
  { id: 'work', label: 'Work', icon: '✎' },
  { id: 'planning', label: 'Planning', icon: '🗓' },
  { id: 'more', label: 'More', icon: '⋯' },
];
const DEFAULT_TABS = ['program', 'projects', 'gates', 'risks', 'time'];
function getTabs() {
  try { return JSON.parse(localStorage.getItem('hub_tabs')) || DEFAULT_TABS; } catch { return DEFAULT_TABS; }
}
function buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = getTabs().map(id => {
    const v = ALL_VIEWS.find(x => x.id === id);
    return v ? `<button data-view="${v.id}" title="${v.label}">${v.icon} ${v.label}</button>` : '';
  }).join('');
}
document.getElementById('nav').addEventListener('click', e => {
  const v = e.target.dataset.view;
  if (v) { currentView = v; render(); }
});
const menu = document.getElementById('menu');
document.getElementById('hamburger').addEventListener('click', e => {
  e.stopPropagation();
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
});
document.addEventListener('click', e => {
  if (e.target.id !== 'hamburger' && !menu.contains(e.target)) menu.style.display = 'none';
});
function buildMenu() {
  const sections = [
    ['Program', [['settings', 'Settings'], ['tabs', 'My tabs']]],
    ['Work', [['work', 'Work (Register / Kanban)'], ['more:ledger', 'Decisions & Conditions']]],
    ['Planning', [['planning', 'Planning (Gantt / Calendar / WBS)']]],
    ['Insights', [['readiness', 'Readiness (MRF)'], ['more:briefing', 'Briefing Pack'], ['more:agents', 'AI Agents'], ['more:allocation', 'Allocation grid'], ['more:invoicing', 'Invoicing'], ['more:bookkeeping', 'Bookkeeping'], ['more:projaccounting', 'Proj. Accounting'], ['more:consolidation', 'Consolidation'], ['more:timereport', 'Time Report']]],
  ];
  menu.innerHTML = sections.map(([title, items]) => `
    <div class="small muted" style="padding:6px 10px 2px;font-weight:700">${title}</div>
    ${items.map(([v, l]) => `<button class="menu-item" data-goto="${v}" style="display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:8px 12px;border-radius:8px;cursor:pointer;font-size:13px">${l}</button>`).join('')}
  `).join('');
  menu.querySelectorAll('.menu-item').forEach(b => b.addEventListener('click', () => {
    menu.style.display = 'none';
    const g = b.dataset.goto;
    if (g === 'tabs') { currentView = 'settings'; settingsTab = 'tabs'; render(); return; }
    if (g.startsWith('more:')) { subView = g.slice(5); currentView = 'more'; render(); return; }
    if (g === 'settings') { currentView = 'settings'; settingsTab = 'store'; render(); return; }
    currentView = g; render();
  }));
}
document.querySelectorAll('.menu-item').forEach(b => b.addEventListener('click', () => {
  menu.style.display = 'none';
  if (b.id === 'menuModules') settingsTab = 'store';
  else if (b.id === 'menuImport') settingsTab = 'import';
  else if (b.id === 'menuProgram') settingsTab = 'program';
  else if (b.id === 'menuRepo') settingsTab = 'repo';
  else if (b.id === 'menuAgents') settingsTab = 'agents';
  else if (b.id === 'menuUsers') settingsTab = 'users';
  else if (b.id === 'menuMistral') settingsTab = 'mistral';
  else if (b.id === 'menuTabs') settingsTab = 'tabs';
  else settingsTab = 'store';
  currentView = 'settings'; render();
}));
async function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
  if (currentView === 'program' || currentView === 'dashboard') return renderDashboard();
  if (currentView === 'projects') return renderProjects();
  if (currentView === 'risks') { subView = 'raid'; currentView = 'more'; return render(); }
  if (currentView === 'time') { app = document.getElementById('app'); return renderTimeReport(); }
  if (currentView === 'gates') return renderGates();
  if (currentView === 'readiness') return renderReadiness();
  if (currentView === 'settings') return renderSettings();
  if (currentView === 'roadmap') return renderRoadmap();
  const SUB = { work: ['register', 'kanban'], planning: ['gantt', 'calendar', 'wbs'], more: ['ledger', 'raid', 'timereport', 'agents', 'briefing', 'allocation', 'invoicing', 'bookkeeping', 'projaccounting', 'consolidation'] };
  if (SUB[currentView]) {
    const sub = SUB[currentView].includes(subView) ? subView : SUB[currentView][0];
    const labels = { register: 'Register', kanban: 'Kanban', gantt: 'Gantt', calendar: 'Calendar', wbs: 'WBS', ledger: 'Decisions & Conditions', raid: 'RAID', timereport: 'Time Report', agents: 'AI Agents', briefing: 'Briefing Pack', allocation: 'Allocation', invoicing: 'Invoicing', bookkeeping: 'Bookkeeping', projaccounting: 'Proj. Accounting', consolidation: 'Consolidation' };
    app.innerHTML = `<div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">${SUB[currentView].map(s => `<button class="btn ${s === sub ? '' : 'ghost'}" onclick="subView='${s}';render()">${labels[s]}</button>`).join('')}</div><div id="subview"></div>`;
    app = document.getElementById('subview');
    if (sub === 'register') await renderRegister();
    else if (sub === 'kanban') await renderKanban();
    else if (sub === 'gantt') await renderGantt();
    else if (sub === 'calendar') await renderCalendar();
    else if (sub === 'wbs') await renderWbs();
    else if (sub === 'ledger') await renderLedger();
    else if (sub === 'raid') await renderRaid();
    else if (sub === 'timereport') await renderTimeReport();
    else if (sub === 'agents') await renderAgents();
    else if (sub === 'briefing') await renderBriefing();
    else if (sub === 'allocation') await renderAllocation();
    else await renderPlaceholder(sub);
    app = document.getElementById('app');
    return;
  }
}

function _floatMenu(m, anchor) {

  const r = anchor.getBoundingClientRect();
  m.style.position = 'fixed';
  m.style.left = Math.min(r.left, window.innerWidth - 210) + 'px';
  m.style.top = (r.bottom + 4) + 'px';

async function renderGantt() {
  const g = await api('/gantt');

               ...g.gates.map(x => ({...x, kind: 'gate', label: x.id + ' ' + x.name, date: x.scheduled_date}))]
              .sort((a, b) => a.date.localeCompare(b.date));
  const min = all[0].date, max = all[all.length - 1].date;
  const span = (new Date(max) - new Date(min)) / 86400000 || 1;
  const pct = d => Math.max(0, Math.min(100, (new Date(d) - new Date(min)) / 86400000 / span * 100));
  app.innerHTML = `
    <h2>Gantt — deliverables & gates timeline</h2>
    <div class="sub">${min} → ${max} · drag deliverable bars to reschedule</div>
    <div class="panel">
      ${all.map(r => `
        <div style="display:grid;grid-template-columns:280px 1fr;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.06)">
          <div class="small">${r.kind === 'gate' ? '◆' : '•'} ${esc(r.label)} <span class="muted">${esc(r.owner || '')}</span></div>
          <div style="position:relative;height:18px;background:rgba(255,255,255,.06);border-radius:6px" data-track="${r.kind==='del' ? esc(r.id) : ''}">
            <div ${r.kind==='del' ? `draggable="true" data-id="${esc(r.id)}" data-date="${esc(r.date)}"` : ''} style="position:absolute;left:${pct(r.date)}%;width:${r.kind==='gate'?2:6}%;top:0;height:100%;border-radius:6px;background:${r.kind==='gate'?'var(--purple)':'linear-gradient(90deg,#6ea8ff,#cfa9ff)'};cursor:${r.kind==='del'?'grab':'default'}"></div>
            <span class="small muted" style="position:absolute;left:${Math.min(pct(r.date)+2,78)}%;top:0">${esc(r.date)}</span>
          </div>
        </div>`).join('')}
    </div>`;
  document.querySelectorAll('[data-id][draggable]').forEach(bar => {
    bar.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', bar.dataset.id); e.dataTransfer.setData('text/date', bar.dataset.date); bar.style.opacity = .4; });
    bar.addEventListener('dragend', () => bar.style.opacity = 1);
  });
  document.querySelectorAll('[data-track]').forEach(track => {
    track.addEventListener('dragover', e => e.preventDefault());
    track.addEventListener('drop', async e => {
      e.preventDefault();
      const id = e.dataTransfer.getData('text/plain');
      if (!id) return;
      const rect = track.getBoundingClientRect();
      const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const dayMs = 86400000;
      const newDate = new Date(new Date(min).getTime() + frac * span * dayMs).toISOString().slice(0, 10);
      await api('/deliverables/update', 'POST', { id, due_date: newDate });
      toast(`Rescheduled ${id} → ${newDate}`);
      render();
    });
  });
}

  const toDate = off => new Date(new Date(pmin).getTime() + off * span * dayMs).toISOString().slice(0, 10);
  document.querySelectorAll('.sapseg').forEach(seg => {
    seg.addEventListener('click', async e => {
      e.stopPropagation();
      const pid = seg.dataset.pid, sp = seg.dataset.sap;
      const p = r.projects.find(x => x.id === pid);
      await api('/program/projects/update', 'POST', { id: pid, name: p.name, program_phase_id: p.program_phase_id, sap_phase: sp, start_date: p.start_date, end_date: p.end_date, status: p.status, light: p.light, project_type: p.project_type });
      toast(`${p.name}: SAP phase → ${sp}`);
      render();
    });
  });
  document.querySelectorAll('.gbar').forEach(bar => {
    const onDown = e => {
      const pt = e.touches ? e.touches[0] : e;
      e.preventDefault();
      const resize = (e.target.classList && e.target.classList.contains('gresize'));
      const track = bar.parentElement.getBoundingClientRect();
      const startX = pt.clientX;
      const origStart = bar.dataset.start, origEnd = bar.dataset.end;
      const origLeft = parseFloat(bar.style.left), origWidth = parseFloat(bar.style.width);
      const move = ev => {
        const pt = ev.touches ? ev.touches[0] : ev;
        const frac = (pt.clientX - startX) / track.width * 100;
        if (resize) {
          bar.style.width = Math.max(2, origWidth + frac) + '%';
        } else {
          bar.style.left = Math.max(0, Math.min(100 - origWidth, origLeft + frac)) + '%';
        }
      };
      const up = async ev => {
        const pt = ev.changedTouches ? ev.changedTouches[0] : ev;
        document.removeEventListener('mousemove', move);
        document.removeEventListener('mouseup', up);
        document.removeEventListener('touchmove', move);
        document.removeEventListener('touchend', up);
        const frac = (pt.clientX - startX) / track.width * 100;
        let ns = origStart, ne = origEnd;
        if (resize) {
          ne = toDate((origEnd ? (new Date(origEnd) - new Date(pmin)) / dayMs / span : 0) + frac / 100);
        } else {
          const days = Math.round(frac / 100 * span);
          ns = new Date(new Date(origStart).getTime() + days * dayMs).toISOString().slice(0, 10);
          ne = new Date(new Date(origEnd).getTime() + days * dayMs).toISOString().slice(0, 10);
        }
        if (ns === origStart && ne === origEnd) return;
        if (bar.dataset.pid) {
          const p = r.projects.find(x => x.id === bar.dataset.pid);
          await api('/program/projects/update', 'POST', { id: p.id, name: p.name, program_phase_id: p.program_phase_id, sap_phase: p.sap_phase, start_date: ns, end_date: ne, status: p.status, light: p.light, project_type: p.project_type });
          toast(`${p.id}: ${ns} → ${ne}`);
        } else if (bar.dataset.phid) {
          const ph = phases.find(x => x.id === bar.dataset.phid);
          await api('/program/phases/update', 'POST', { id: ph.id, name: ph.name, start_date: ns, end_date: ne });
          toast(`${ph.name}: ${ns} → ${ne}`);
        }
        render();
      };
      document.addEventListener('mousemove', move);
      document.addEventListener('mouseup', up);
      document.addEventListener('touchmove', move, { passive: false });
      document.addEventListener('touchend', up);
    };
    bar.addEventListener('mousedown', onDown);
    bar.addEventListener('touchstart', onDown, { passive: false });
  });
}

async function importXlsx(kind) {
  const input = document.getElementById(kind === 'deliverables' ? 'impDeliv' : 'impDec');
  const out = document.getElementById(kind === 'deliverables' ? 'impDelivResult' : 'impDecResult');
  if (!input.files[0]) { out.textContent = 'Choose an .xlsx file first.'; out.style.color = 'var(--red)'; return; }
  const buf = await input.files[0].arrayBuffer();
  let bin = ''; const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
  out.textContent = 'Uploading…'; out.style.color = 'var(--muted)';
  const res = await api('/import', 'POST', { kind, file: btoa(bin) });
  if (res.error) { out.textContent = 'Error: ' + res.error; out.style.color = 'var(--red)'; }
  else { out.textContent = `Imported ${res.imported} rows from sheet "${res.sheet}" (${res.skipped} skipped).`; out.style.color = 'var(--green)'; }
}

async function renderWbs() {
  const [wbs, progs] = await Promise.all([api('/wbs'), api('/program')]);
  const projName = Object.fromEntries(progs.projects.map(p => [p.id, p.name + ' (' + p.project_type + ')']));
  const byProj = {};
  wbs.forEach(w => (byProj[w.project_id] = byProj[w.project_id] || []).push(w));
  const allDates = wbs.flatMap(w => [w.start_date, w.end_date]).filter(Boolean);
  const min = allDates.sort()[0] || '2026-01-01';
  const max = allDates.sort().reverse()[0] || '2027-12-31';
  const span = (new Date(max) - new Date(min)) / 86400000 || 1;
  const pct = d => Math.max(0, Math.min(100, (new Date(d) - new Date(min)) / 86400000 / span * 100));
  const wdt = d => Math.max(1.5, (new Date(d) - new Date(min)) / 86400000 / span * 100);
  const depth = w => w.parent_id ? (wbs.find(p => p.id === w.parent_id) ? 1 + depth(wbs.find(p => p.id === w.parent_id)) : 1) : 0;
  app.innerHTML = `
    <h2>WBS & Gantt</h2>
    <div class="sub">Work breakdown structure per project — the bars below are the Gantt chart generated from the WBS</div>
    ${Object.entries(byProj).map(([pid, items]) => `
      <div class="panel" style="margin-bottom:16px">
        <h3>${esc(projName[pid] || pid)} <span class="small muted">${esc(pid)}</span></h3>
        <div style="margin-bottom:8px"><button class="btn ghost" onclick="wbsAdd('${pid}', '')">+ Add node</button></div>
        ${items.sort((a, b) => a.code.localeCompare(b.code)).map(w => `
          <div style="display:grid;grid-template-columns:${16 + depth(w) * 18}px 90px 1fr;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.05)">
            <div style="padding-left:${depth(w) * 18}px" class="small">${w.parent_id ? '└' : ''} ${esc(w.name)}</div>
            <div class="small muted">${esc(w.code)}</div>
            <div style="position:relative;height:16px;background:rgba(255,255,255,.06);border-radius:5px">
              <div style="position:absolute;left:${pct(w.start_date)}%;width:${w.end_date ? wdt(w.end_date) : 2}%;top:0;height:100%;border-radius:5px;background:${w.parent_id ? 'linear-gradient(90deg,#6ea8ff,#cfa9ff)' : 'var(--purple)'}"></div>
              <span class="small muted" style="position:absolute;left:${Math.min(pct(w.start_date) + (w.end_date ? wdt(w.end_date) : 2) + 1, 70)}%;top:0">${esc(w.start_date)} → ${esc(w.end_date)}</span>
            </div>
          </div>`).join('')}
      </div>`).join('') || '<div class="panel muted">No WBS yet.</div>'}`;
}

function toast(msg, kind = 'ok') {
  let t = document.getElementById('hubToast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'hubToast';
    t.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2000;background:linear-gradient(165deg, rgba(52,62,92,.95), rgba(22,28,48,.97));border:1px solid var(--glass-border);border-radius:14px;padding:12px 20px;box-shadow:0 18px 50px rgba(0,0,0,.6), inset 0 1px 0 var(--glass-highlight);backdrop-filter:blur(30px);color:var(--text);font-size:13.5px;display:none';
    t.innerHTML = '<b style="background:linear-gradient(90deg,#8ab8ff,#cfa9ff);-webkit-background-clip:text;background-clip:text;color:transparent">The Hub</b> <span id="hubToastMsg"></span>';
    document.body.appendChild(t);
  }
  document.getElementById('hubToastMsg').textContent = msg;
  t.style.borderColor = kind === 'err' ? 'rgba(255,125,120,.5)' : 'rgba(94,227,138,.5)';
  t.style.display = 'block';
  clearTimeout(window._toastT);
  window._toastT = setTimeout(() => t.style.display = 'none', 3500);
}

async function saveReportCover(gateId) {
  let logo = '', logoName = '';
  const f = document.getElementById('rcLogo').files[0];
  if (f) {
    logo = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
    logoName = f.name;
  }
  const cur = await api('/gates/' + gateId + '/report');
  const rc = cur.report_config || {};
  const res = await api('/gates/report/save', 'POST', {
    gate_id: gateId,
    logo: logo || rc.logo || '',
    logo_name: logoName || rc.logo_name || '',
    front_title: document.getElementById('rcTitle').value,
    front_description: document.getElementById('rcDesc').value,
  });
  if (res.ok) { closeModal(); alert('Report cover saved. Open the report to see it.'); }
  else alert('Save failed: ' + (res.error || 'unknown'));
}
