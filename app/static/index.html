<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milestone Hub — Program Control Center</title>
<style>
  :root {
    --text: #f2f5fa; --muted: rgba(235, 242, 255, .58);
    --glass: rgba(255, 255, 255, .07);
    --glass-strong: rgba(255, 255, 255, .11);
    --glass-border: rgba(255, 255, 255, .16);
    --glass-highlight: rgba(255, 255, 255, .22);
    --accent: #6ea8ff;
    --green: #5ee38a; --amber: #ffcf6e; --red: #ff7d78; --purple: #cfa9ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1100px 700px at 12% -10%, rgba(110, 140, 255, .32), transparent 60%),
      radial-gradient(900px 650px at 88% 8%, rgba(160, 90, 255, .28), transparent 55%),
      radial-gradient(1000px 800px at 50% 115%, rgba(60, 200, 190, .22), transparent 60%),
      radial-gradient(700px 500px at 70% 55%, rgba(255, 120, 170, .14), transparent 60%),
      #0a0e1a;
    background-attachment: fixed;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 0 24px; height: 58px;
    position: sticky; top: 0; z-index: 10;
    background: rgba(14, 18, 32, .42);
    border-bottom: 1px solid var(--glass-border);
    box-shadow: inset 0 1px 0 var(--glass-highlight);
    backdrop-filter: blur(28px) saturate(170%);
    -webkit-backdrop-filter: blur(28px) saturate(170%);
  }
  header .logo { font-weight: 700; font-size: 17px; letter-spacing: .3px; text-shadow: 0 1px 8px rgba(110,168,255,.35); }
  header .logo span { background: linear-gradient(90deg, #8ab8ff, #cfa9ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  nav { display: flex; gap: 4px; margin-left: 12px; }
  nav button {
    background: transparent; border: 1px solid transparent; color: var(--muted);
    padding: 8px 12px; border-radius: 10px; cursor: pointer; font-size: 13.5px;
    transition: all .18s ease;
  }
  nav button:hover { color: var(--text); background: rgba(255,255,255,.06); }
  nav button.active {
    color: var(--text);
    background: linear-gradient(160deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
    border-color: var(--glass-border);
    box-shadow: 0 4px 14px rgba(0,0,0,.25), inset 0 1px 0 var(--glass-highlight);
  }
  main { padding: 26px; max-width: 1280px; margin: 0 auto; }
  h2 { font-size: 21px; margin-bottom: 4px; letter-spacing: .2px; text-shadow: 0 1px 10px rgba(0,0,0,.4); }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .grid { display: grid; gap: 16px; }
  .cards { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
  .card {
    background: linear-gradient(160deg, var(--glass-strong), var(--glass) 55%, rgba(255,255,255,.04));
    border: 1px solid var(--glass-border); border-radius: 16px; padding: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 var(--glass-highlight);
    backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%);
  }
  .card .kpi { font-size: 28px; font-weight: 700; background: linear-gradient(90deg, #fff, #bcd4ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card .lbl { color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  .panel {
    background: linear-gradient(160deg, var(--glass-strong), var(--glass) 55%, rgba(255,255,255,.04));
    border: 1px solid var(--glass-border); border-radius: 16px; padding: 18px;
    box-shadow: 0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 var(--glass-highlight);
    backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%);
  }
  .panel h3 { font-size: 15px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; padding: 8px 10px; border-bottom: 1px solid var(--glass-border); }
  td { padding: 10px; border-bottom: 1px solid rgba(255,255,255,.07); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; border: 1px solid; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  .p-green { background: rgba(94,227,138,.14); color: var(--green); border-color: rgba(94,227,138,.35); }
  .p-amber { background: rgba(255,207,110,.14); color: var(--amber); border-color: rgba(255,207,110,.35); }
  .p-red { background: rgba(255,125,120,.14); color: var(--red); border-color: rgba(255,125,120,.35); }
  .p-purple { background: rgba(207,169,255,.14); color: var(--purple); border-color: rgba(207,169,255,.35); }
  .p-gray { background: rgba(255,255,255,.08); color: var(--muted); border-color: var(--glass-border); }
  .bar { height: 9px; background: rgba(255,255,255,.09); border-radius: 999px; overflow: hidden; min-width: 90px; box-shadow: inset 0 1px 3px rgba(0,0,0,.4); }
  .bar > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #6ea8ff, #cfa9ff); box-shadow: 0 0 10px rgba(140,160,255,.55); }
  .att { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.07); font-size: 13.5px; align-items: baseline; }
  .att:last-child { border-bottom: none; }
  .att::before { content: "▸"; color: var(--red); text-shadow: 0 0 8px rgba(255,125,120,.6); }
  .gate-rail { display: flex; gap: 10px; align-items: stretch; flex-wrap: wrap; }
  .gate-node {
    flex: 1; min-width: 130px; border-radius: 14px; padding: 12px;
    background: linear-gradient(160deg, var(--glass-strong), var(--glass));
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 24px rgba(0,0,0,.3), inset 0 1px 0 var(--glass-highlight);
    backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
  }
  .gate-node.current { border-color: rgba(140,175,255,.65); box-shadow: 0 0 0 1px rgba(140,175,255,.5), 0 0 24px rgba(110,168,255,.35), inset 0 1px 0 var(--glass-highlight); }
  .gate-node .gid { font-weight: 700; font-size: 13px; }
  .gate-node .gname { color: var(--muted); font-size: 12px; margin: 4px 0 8px; min-height: 28px; }
  .gate-node .gdate { font-size: 12px; color: var(--muted); }
  .two-col { grid-template-columns: 1fr 1fr; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
  .btn {
    background: linear-gradient(160deg, rgba(140,175,255,.85), rgba(110,140,255,.75));
    color: #fff; border: 1px solid rgba(255,255,255,.35); padding: 7px 14px; border-radius: 10px;
    cursor: pointer; font-size: 13px; font-weight: 600;
    box-shadow: 0 6px 18px rgba(110,140,255,.35), inset 0 1px 0 rgba(255,255,255,.4);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 9px 22px rgba(110,140,255,.45), inset 0 1px 0 rgba(255,255,255,.5); }
  .btn.ghost {
    background: linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,.05));
    color: var(--text); border: 1px solid var(--glass-border);
    box-shadow: 0 4px 14px rgba(0,0,0,.25), inset 0 1px 0 var(--glass-highlight);
  }
  select, input, textarea {
    background: rgba(10, 14, 26, .45); border: 1px solid var(--glass-border); color: var(--text);
    border-radius: 9px; padding: 6px 8px; font-size: 13px;
    box-shadow: inset 0 1px 4px rgba(0,0,0,.35);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  select:focus, input:focus, textarea:focus { outline: 1px solid rgba(140,175,255,.6); }
  .modal-bg { position: fixed; inset: 0; background: rgba(5, 8, 16, .55); display: none; align-items: center; justify-content: center; z-index: 20; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .modal-bg.open { display: flex; }
  .modal {
    border-radius: 20px; padding: 22px; width: 440px; max-width: 92vw;
    background: linear-gradient(165deg, rgba(52, 62, 92, .72), rgba(22, 28, 48, .78));
    border: 1px solid var(--glass-border);
    box-shadow: 0 24px 70px rgba(0,0,0,.55), inset 0 1px 0 var(--glass-highlight);
    backdrop-filter: blur(36px) saturate(170%); -webkit-backdrop-filter: blur(36px) saturate(170%);
  }
  .modal h3 { margin-bottom: 14px; }
  .modal label { display: block; color: var(--muted); font-size: 12.5px; margin: 10px 0 4px; }
  .modal input, .modal select, .modal textarea { width: 100%; }
  .modal .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; }
  .brief { font-size: 14px; line-height: 1.65; }
  .brief h4 { margin: 16px 0 6px; font-size: 14px; background: linear-gradient(90deg, #8ab8ff, #cfa9ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .brief li { margin-left: 18px; margin-bottom: 4px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  .kanban { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; align-items: start; }
  .kb-col {
    border-radius: 16px; padding: 12px; min-height: 200px;
    background: linear-gradient(170deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
    border: 1px solid var(--glass-border);
    box-shadow: 0 8px 26px rgba(0,0,0,.3), inset 0 1px 0 var(--glass-highlight);
    backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .kb-col.drag-over { border-color: rgba(140,175,255,.7); box-shadow: 0 0 0 1px rgba(140,175,255,.5), 0 0 26px rgba(110,168,255,.4); }
  .kb-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 13px; font-weight: 700; }
  .kb-count { background: rgba(255,255,255,.1); border: 1px solid var(--glass-border); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--muted); }
  .kb-card {
    border-radius: 12px; padding: 10px; margin-bottom: 8px; cursor: grab; font-size: 13px;
    background: linear-gradient(160deg, rgba(255,255,255,.14), rgba(255,255,255,.05));
    border: 1px solid var(--glass-border);
    box-shadow: 0 5px 16px rgba(0,0,0,.28), inset 0 1px 0 var(--glass-highlight);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .kb-card:hover { transform: translateY(-2px); box-shadow: 0 9px 22px rgba(0,0,0,.35), inset 0 1px 0 var(--glass-highlight); }
  .kb-card.dragging { opacity: .35; }
  .kb-card .kb-id { color: var(--muted); font-size: 11px; font-weight: 700; }
  .kb-card .kb-title { margin: 3px 0 6px; line-height: 1.35; }
  .kb-meta { display: flex; justify-content: space-between; gap: 6px; font-size: 11.5px; color: var(--muted); flex-wrap: wrap; }
  .kb-del { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 12px; padding: 2px 5px; border-radius: 6px; }
  .kb-del:hover { color: var(--red); background: rgba(255,125,120,.14); }
  .rowmenu .menu-item { display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px; }
  .rowmenu .menu-item:hover { background: rgba(255,255,255,.1); }
  .tl { display:inline-block; width:14px; height:14px; border-radius:50%; cursor:pointer; border:2px solid rgba(255,255,255,.25); }
  .tl-green { background:#3fb950; box-shadow:0 0 8px rgba(63,185,80,.8); }
  .tl-amber { background:#d29922; box-shadow:0 0 8px rgba(210,153,34,.8); }
  .tl-red { background:#f85149; box-shadow:0 0 8px rgba(248,81,73,.8); }
  .tl-lg { width:20px; height:20px; }
</style>
</head>
<body>
<header>
  <div class="logo">Milestone<span>Hub</span> · Control Center</div>
  <nav id="nav">
    <button data-view="dashboard" class="active">Dashboard</button>
    <button data-view="gates">Gates</button>
    <button data-view="register">Register</button>
    <button data-view="kanban">Kanban</button>
    <button data-view="ledger">Decisions &amp; Conditions</button>
    <button data-view="raid">RAID</button>
    <button data-view="gantt">Gantt</button>
    <button data-view="roadmap">Roadmap</button>
    <button data-view="timereport">Time Report</button>
    <button data-view="agents">AI Agents</button>
    <button data-view="briefing">Briefing Pack</button>
  </nav>
  <button id="hamburger" title="Settings" style="margin-left:auto;background:transparent;border:1px solid var(--glass-border);color:var(--text);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:16px;line-height:1">☰</button>
  <div id="menu" style="display:none;position:absolute;top:54px;right:16px;background:linear-gradient(165deg, rgba(52,62,92,.85), rgba(22,28,48,.9));border:1px solid var(--glass-border);border-radius:14px;padding:8px;min-width:210px;box-shadow:0 18px 50px rgba(0,0,0,.5), inset 0 1px 0 var(--glass-highlight);backdrop-filter:blur(30px) saturate(160%);-webkit-backdrop-filter:blur(30px) saturate(160%);z-index:30">
    <button class="menu-item" data-view="settings" style="display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px">⚙ Settings</button>
    <button class="menu-item" id="menuModules" style="display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px">▦ App store</button>
    <button class="menu-item" id="menuImport" style="display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px">⇪ Import from Excel</button>
    <button class="menu-item" id="menuProgram" style="display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px">▤ Program &amp; projects</button>
    <button class="menu-item" id="menuRepo" style="display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px">☁ Document repository</button>
    <button class="menu-item" id="menuAgents" style="display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px">🤖 AI agents</button>
    <button class="menu-item" id="menuTaskapps" style="display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px">☑ Task apps</button>
    <button class="menu-item" id="menuUsers" style="display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:9px 12px;border-radius:8px;cursor:pointer;font-size:13.5px">👤 Users</button>
  </div>
</header>
<main id="app"></main>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<script>
const app = document.getElementById('app');
let currentView = 'dashboard';
let moduleMap = {};
let settingsTab = 'store';
async function api(path, method = 'GET', body = null) {
  const res = await fetch('/api' + path, { method, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : null });
  return res.json();
}
function pill(text, cls) { return `<span class="pill ${cls}">${esc(text)}</span>`; }
function esc(s) { return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function statePill(s) {
  const map = { verified: ['Verified','p-green'], in_review: ['In review','p-purple'], in_progress: ['In progress','p-amber'], blocked: ['Blocked','p-red'], not_started: ['Not started','p-gray'] };
  const [t, c] = map[s] || [s, 'p-gray']; return pill(t, c);
}
function gatePill(s) {
  const map = { passed: ['Passed','p-green'], passed_with_conditions: ['Passed w/ conditions','p-amber'], failed: ['Failed','p-red'], held: ['Held','p-purple'], in_progress: ['In progress','p-amber'], upcoming: ['Upcoming','p-gray'] };
  const [t, c] = map[s] || [s, 'p-gray']; return pill(t, c);
}
function sevPill(s) {
  const map = { very_high: ['Very High','p-red'], high: ['High','p-red'], medium: ['Medium','p-amber'], low: ['Low','p-gray'] };
  const [t, c] = map[s] || [s, 'p-gray']; return pill(t, c);
}
function evPill(s) {
  const map = { present: ['Present','p-green'], partial: ['Partial','p-amber'], missing: ['Missing','p-red'] };
  const [t, c] = map[s] || [s, 'p-gray']; return pill(t, c);
}
function condPill(s) {
  const map = { open: ['Open','p-amber'], met: ['Met','p-green'], expired: ['Expired','p-red'] };
  const [t, c] = map[s] || [s, 'p-gray']; return pill(t, c);
}
async function loadModules() {
  const mods = await api('/modules');
  moduleMap = Object.fromEntries(mods.map(m => [m.name, m]));
  const viewFor = { decisions: 'ledger', risks: 'raid', gantt: 'gantt', kanban: 'kanban', timereport: 'timereport', agents: 'agents' };
  document.querySelectorAll('#nav button').forEach(b => {
    const mod = Object.keys(viewFor).find(k => viewFor[k] === b.dataset.view);
    if (mod) b.style.display = moduleMap[mod] && moduleMap[mod].enabled ? '' : 'none';
  });
}
document.getElementById('nav').addEventListener('click', e => {
  const v = e.target.dataset.view;
  if (v) { currentView = v; render(); }
});
const menu = document.getElementById('menu');
document.getElementById('hamburger').addEventListener('click', e => {
  e.stopPropagation();
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
});
document.addEventListener('click', e => {
  if (e.target.id !== 'hamburger' && !menu.contains(e.target)) menu.style.display = 'none';
});
document.querySelectorAll('.menu-item').forEach(b => b.addEventListener('click', () => {
  menu.style.display = 'none';
  if (b.id === 'menuModules') settingsTab = 'store';
  else if (b.id === 'menuImport') settingsTab = 'import';
  else if (b.id === 'menuProgram') settingsTab = 'program';
  else if (b.id === 'menuRepo') settingsTab = 'repo';
  else if (b.id === 'menuAgents') settingsTab = 'agents';
  else if (b.id === 'menuTaskapps') settingsTab = 'taskapps';
  else if (b.id === 'menuUsers') settingsTab = 'users';
  else settingsTab = 'store';
  currentView = 'settings'; render();
}));
async function render() {
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b.dataset.view === currentView));
  if (currentView === 'dashboard') return renderDashboard();
  if (currentView === 'gates') return renderGates();
  if (currentView === 'register') return renderRegister();
  if (currentView === 'kanban') return renderKanban();
  if (currentView === 'ledger') return renderLedger();
  if (currentView === 'raid') return renderRaid();
  if (currentView === 'briefing') return renderBriefing();
  if (currentView === 'settings') return renderSettings();
  if (currentView === 'gantt') return renderGantt();
  if (currentView === 'roadmap') return renderRoadmap();
  if (currentView === 'timereport') return renderTimeReport();
  if (currentView === 'agents') return renderAgents();
}
function lightDot(l, lg) { return `<span class="tl tl-${esc(l||'green')}${lg?' tl-lg':''}" title="${esc(l||'green')}"></span>`; }
async function setProjectLight(id, light) { await api('/light/project', 'POST', { id, light }); render(); }
async function setProgramLight(light) { await api('/light/program', 'POST', { light }); render(); }
function lightPicker(current, onPick) {
  return `<span style="display:inline-flex;gap:6px;align-items:center">${['green','amber','red'].map(l => `<span class="tl tl-${l}" title="set ${l}" onclick="(${onPick})('${l}')"></span>`).join('')}</span>`;
}
async function renderDashboard() {
  const d = await api('/dashboard');
  const g = d.next_gate, r = d.next_gate_readiness;
  app.innerHTML = `
    <h2>Program Dashboard</h2>
    <div class="sub">Assembled from the record · ${esc(d.today)}</div>
    <div class="grid cards">
      <div class="card" style="cursor:pointer" onclick="currentView='roadmap';render()" title="Program status — click to open Roadmap">
        <div class="kpi" style="display:flex;align-items:center;gap:10px">${lightDot(d.program_light, true)} <span style="font-size:14px">Program</span></div>
        <div class="lbl">Traffic light ${lightPicker(d.program_light, 'setProgramLight')} · click for roadmap</div>
      </div>
      ${d.projects.map(p => `<div class="card" style="cursor:pointer" onclick="currentView='roadmap';render()">
        <div class="kpi" style="display:flex;align-items:center;gap:8px;font-size:16px">${lightDot(p.light)} ${esc(p.id)}</div>
        <div class="lbl">${esc(p.name)} · ${p.deliverable_count} deliverables · ${esc(p.status)} ${lightPicker(p.light, 'function(l){setProjectLight(\'' + p.id + '\',l)}')}</div>
      </div>`).join('')}
      <div class="card"><div class="kpi">${r ? r.pct + '%' : '—'}</div><div class="lbl">Evidence readiness · next gate ${esc(g?.id)}</div></div>
      <div class="card"><div class="kpi">${d.counts.open_conditions}</div><div class="lbl">Open gate conditions ${d.counts.overdue_conditions ? `(${d.counts.overdue_conditions} overdue)` : ''}</div></div>
      <div class="card"><div class="kpi">${d.counts.open_decisions}</div><div class="lbl">Open / escalated decisions</div></div>
      <div class="card"><div class="kpi">${d.counts.blocked_deliverables}</div><div class="lbl">Blocked deliverables</div></div>
    </div>
    <div class="grid two-col" style="margin-top:16px">
      <div class="panel">
        <h3>Next gate — ${esc(g?.name)} (${esc(g?.id)})</h3>
        <div class="muted small">Scheduled ${esc(g?.scheduled_date)} · Gate Chair: ${esc(g?.chair)} · ${gatePill(g?.status)}</div>

async function importXlsx(kind) {
  const input = document.getElementById(kind === 'deliverables' ? 'impDeliv' : 'impDec');
  const out = document.getElementById(kind === 'deliverables' ? 'impDelivResult' : 'impDecResult');
  if (!input.files[0]) { out.textContent = 'Choose an .xlsx file first.'; out.style.color = 'var(--red)'; return; }
  const buf = await input.files[0].arrayBuffer();
  let bin = ''; const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i += 8192) bin += String.fromCharCode(...bytes.subarray(i, i + 8192));
  out.textContent = 'Uploading…'; out.style.color = 'var(--muted)';
  const res = await api('/import', 'POST', { kind, file: btoa(bin) });
  if (res.error) { out.textContent = 'Error: ' + res.error; out.style.color = 'var(--red)'; }
  else { out.textContent = `Imported ${res.imported} rows from sheet "${res.sheet}" (${res.skipped} skipped).`; out.style.color = 'var(--green)'; }
}

  document.getElementById('modalBg').classList.add('open');
}
async function saveReportCover(gateId) {
  let logo = '', logoName = '';
  const f = document.getElementById('rcLogo').files[0];
  if (f) {
    logo = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(f); });
    logoName = f.name;
  }
  const cur = await api('/gates/' + gateId + '/report');
  const rc = cur.report_config || {};
  const res = await api('/gates/report/save', 'POST', {
    gate_id: gateId,
    logo: logo || rc.logo || '',
    logo_name: logoName || rc.logo_name || '',
    front_title: document.getElementById('rcTitle').value,
    front_description: document.getElementById('rcDesc').value,
  });
  if (res.ok) { closeModal(); alert('Report cover saved. Open the report to see it.'); }
  else alert('Save failed: ' + (res.error || 'unknown'));
}
function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
document.getElementById('modalBg').addEventListener('click', e => { if (e.target.id === 'modalBg') closeModal(); });
loadModules().then(render);
</script>
